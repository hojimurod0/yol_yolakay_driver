name: yol_yolakay_driver
description: "YolYolakay Haydovchi — Intercity Taxi & Ride-Sharing Driver Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management & Navigation
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Network & Storage
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.3

  # UI & Media
  shimmer: ^3.0.0
  image_picker: ^1.1.2

  # Utilities
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.1.0

  # Firebase & Production Monitoring
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.4
  flutter_local_notifications: ^18.0.1

  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/images/
